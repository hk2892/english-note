<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 본문 단어장</title>
<style>
:root{
  --bg:#fafafa;--fg:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;
  --hl:#fef08a;--card:#ffffff;--folder:#ffdf80;--folder2:#fdd66a;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#121212;--fg:#f2f2f7;--line:#2c2c2e;--card:#1c1c1e;--folder:#a8863a;--folder2:#8f7030;--hl:#854d0e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:var(--blue)}
.screen{display:none;height:100%;flex-direction:column;opacity:0;transition:opacity .2s ease}
.screen.on{display:flex;opacity:1}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);min-height:56px;background:var(--card)}
header h1{font-size:20px;margin:0;font-weight:700}
header .c{font-weight:700;font-size:19px;color:var(--fg)}
header .r{display:flex;gap:18px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:36px;overflow:auto}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);padding:20px;gap:18px}}
.folder{position:relative;aspect-ratio:1.25;background:var(--folder);border-radius:6px 14px 14px 14px;display:flex;align-items:center;justify-content:center;font-weight:600;text-align:center;padding:10px;color:#4a3b10;user-select:none;-webkit-user-select:none;margin-top:12px;transition:transform .15s ease}
.folder:before{content:"";position:absolute;top:-12px;left:0;width:45%;height:14px;background:var(--folder2);border-radius:6px 6px 0 0}
.folder:active{transform:scale(.96)}

/* 스테이지 및 슬라이드 캐러셀 */
.stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}

.pg-viewport{
  position:relative;
  width:100%;
  height:calc(100% - 40px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.pg{
  position:absolute;
  width:min(44%, 440px);
  height:100%;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  overflow:auto;
  padding:32px;
  box-shadow:0 4px 20px rgba(0,0,0,.04);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
  will-change: transform, opacity;
}

/* 위치 상태 클래스 */
.pg.cur{
  transform: translateX(0) scale(1);
  opacity:1;
  z-index:3;
  pointer-events:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.pg.prev{
  transform: translateX(-118%) scale(0.96);
  opacity:0.35;
  z-index:1;
  pointer-events:none;
}
.pg.next{
  transform: translateX(118%) scale(0.96);
  opacity:0.35;
  z-index:1;
  pointer-events:none;
}
.pg.far-left{
  transform: translateX(-240%) scale(0.9);
  opacity:0;
  z-index:0;
}
.pg.far-right{
  transform: translateX(240%) scale(0.9);
  opacity:0;
  z-index:0;
}

.pg.add{
  border:2px dashed var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  color:var(--sub);
  cursor:pointer;
  background:transparent;
  box-shadow:none;
}
.pg.empty{display:flex;align-items:center;justify-content:center}
.pg p{font-size:20px;line-height:2.1;margin:0 0 22px;word-spacing:2px;color:var(--fg)}

/* 형광펜 효과 */
.w{
  border-radius:4px;
  padding:2px 3px;
  cursor:pointer;
  display:inline;
  background-image: linear-gradient(var(--hl), var(--hl));
  background-repeat: no-repeat;
  background-size: 0% 100%;
  transition: background-size .25s ease-in-out, color .2s ease;
}
.w.h{
  background-size: 100% 100%;
  color: #000 !important;
}

/* iPad용 페이지 넘김 버튼 */
.nav{
  position:absolute;
  top:50%;
  z-index:20;
  width:56px;
  height:56px;
  padding:0;
  border-radius:50%;
  background:rgba(255,255,255,.96);
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  border:1px solid rgba(0,0,0,.08);
  color:#333;
  font-size:0;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-appearance:none;
  appearance:none;
  transition:transform .15s ease, box-shadow .15s ease;
}

.nav::before{
  content:"";
  width:11px;
  height:11px;
  border-top:2.5px solid currentColor;
  border-right:2.5px solid currentColor;
  display:block;
}

.nav.l::before{
  transform:rotate(-135deg);
  margin-left:4px;
}

.nav.r::before{
  transform:rotate(45deg);
  margin-right:4px;
}

.nav:active{
  transform:translateY(-50%) scale(.94);
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.nav.l{ left:30px; }
.nav.r{ right:30px; }

@media(max-width:800px){
  .nav.l{ left:24px; }
  .nav.r{ right:24px; }
}

.foot{padding:16px;text-align:center;border-top:1px solid var(--line);background:var(--card)}
.btn{background:var(--blue);color:#fff;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;white-space:nowrap}
.btn:disabled{background:#d1d1d1;color:#888;cursor:not-allowed;opacity:1}
.quiz-result{display:flex;flex-direction:column;align-items:center;gap:2px}
.quiz-result .quiz-answer{color:var(--sub);font-size:14px;margin:0;line-height:1.2}
.quiz-result .word{margin:0;line-height:1.15}
.quiz-result .res{margin:0;line-height:1.2}
.quiz-wrong-msg{color:var(--sub);font-size:13px;margin:0;text-decoration:underline;cursor:pointer;line-height:1.2}
.quiz-next{margin-top:5px;display:flex;justify-content:center}
.btn.o{background:none;color:var(--blue);border:1px solid var(--blue)}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.box{background:var(--card);border-radius:20px;padding:28px;width:min(680px,100%);max-height:85%;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.box h2{margin:0 0 16px;font-size:20px;font-weight:700}
.box textarea,.box input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg)}
.box textarea{height:180px;resize:none}

/* 단어장 버튼 4개 한 줄(일렬) 정렬 */
.acts{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
  align-items:center;
  flex-wrap:nowrap;
}
.acts .btn{
  flex:1;
  text-align:center;
  padding:12px 8px;
  font-size:14px;
}

/* 새 폴더 생성/이름 변경 확인창: 취소와 확인 버튼을 같은 크기로 */
#m-name .acts{
  justify-content:flex-end;
}
#m-name .acts button{
  flex:0 0 72px;
  width:72px;
  box-sizing:border-box;
  text-align:center;
  padding:12px 8px;
}

.tabs{display:flex;gap:20px;margin-bottom:12px;border-bottom:1px solid var(--line)}.tabs button{color:var(--sub);font-weight:600;padding:8px 4px;font-size:16px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom:2px solid var(--fg)}
.list{overflow:auto;flex:1;min-height:220px}
.row{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.q{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
.q .word{font-size:52px;font-weight:800}.q input{max-width:480px;text-align:center;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--line)}
.q .res{font-size:36px;font-weight:800;margin-top:10px}.q .mean{color:var(--sub);font-size:22px}
.skip{color:var(--sub);text-decoration:underline;font-size:15px;margin-top:8px}
.stat{color:var(--sub);font-size:15px}
</style>
</head>
<body>

<div id="home" class="screen on">
  <header><h1>내 폴더</h1><button onclick="askName('새 폴더 생성','',addFolder)">+ 새 폴더</button></header>
  <div class="grid" id="grid"></div>
</div>

<div id="fold" class="screen">
  <header>
    <button onclick="show('home')">‹ 메인</button><div class="c" id="ftitle"></div>
    <div class="r"><button onclick="copyBody()">본문 복사</button><button onclick="openVocab()">단어장</button></div>
  </header>
  <div class="stage" id="pageStage">
    <button class="nav l" onclick="prevPage()">‹</button>
    <div class="pg-viewport" id="viewport"></div>
    <button class="nav r" onclick="nextPage()">›</button>
  </div>
  <div class="foot"><button class="btn" onclick="editPage()">본문 수정</button></div>
</div>

<div id="quiz" class="screen">
  <header><button onclick="endQuiz(true)">나가기</button><div class="c">퀴즈 진행 중</div><div class="stat" id="qstat"></div></header>
  <div class="q" id="qbody"></div>
</div>

<div class="mask" id="m-name"><div class="box"><h2 id="mn-t"></h2><input id="mn-i"><div class="acts"><button onclick="closeM('m-name')">취소</button><button class="btn" id="mn-ok">확인</button></div></div></div>
<div class="mask" id="m-menu"><div class="box menu" style="width:300px;padding:16px"><h2 style="text-align:center;font-size:16px;margin:8px" id="mm-t">폴더 설정</h2><button id="mm-r">이름 변경</button><button id="mm-d" style="color:var(--red)">폴더 삭제</button><button onclick="closeM('m-menu')">취소</button></div></div>
<div class="mask" id="m-body"><div class="box"><h2 id="mb-t">본문 추가</h2><textarea id="mb-i" placeholder="본문을 붙여넣어 주세요."></textarea><div class="acts"><button id="mb-del" style="color:var(--red);margin-right:auto">페이지 삭제</button><button onclick="closeM('m-body')">취소</button><button class="btn" id="mb-ok">확인</button></div></div></div>

<div class="mask" id="m-vocab">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>수집된 단어장</h2><button onclick="closeM('m-vocab')">닫기</button></div>
    <div class="tabs"><button id="t-word" onclick="vtab='word';renderVocab()">단어</button><button id="t-idiom" onclick="vtab='idiom';renderVocab()">숙어</button></div>
    <div class="list" id="vlist"></div>
    <div class="acts">
      <button class="btn o" onclick="copyVocabList()">단어장 복사</button>
      <button class="btn o" onclick="copyPrompt()">AI 프롬프트 복사</button>
      <button class="btn o" onclick="bulkAsk()">AI 결과 등록</button>
      <button class="btn" id="qstart" onclick="startQuiz()">퀴즈 시작</button>
    </div>
  </div>
</div>

<div class="mask" id="m-bulk"><div class="box"><h2>AI 응답 결과 일괄 등록</h2><textarea id="bk-i" placeholder="단어: 뜻&#10;[숙어]&#10;숙어: 뜻"></textarea><div class="acts"><button onclick="closeM('m-bulk')">취소</button><button class="btn" onclick="bulkApply()">확인</button></div></div></div>

<script>
const KEY='vocabApp_fix_perfect_v7';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){
  try{ const old=JSON.parse(localStorage.getItem('vocabApp_fix_center_v6')||localStorage.getItem('vocabApp_v1')); if(old) S=old; }catch(e){}
}
S=S||{folders:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
let F=null,idx=0,vtab='word',Q=null;

document.addEventListener('click',e=>{
  const stage=$('pageStage');
  if(!stage || !stage.contains(e.target))return;

  // 카드/버튼/입력창을 누른 것은 페이지 이동으로 처리하지 않음
  if(e.target.closest('.pg') || e.target.closest('.nav'))return;

  const rect=stage.getBoundingClientRect();
  if(e.clientX < rect.left + rect.width/2) prevPage();
  else nextPage();
});

const show=id=>{
  document.querySelectorAll('.screen').forEach(s=>{
    if(s.id===id){
      s.style.display='flex';
      setTimeout(()=>s.classList.add('on'),10);
    }else{
      s.classList.remove('on');
      setTimeout(()=>s.style.display='none',200);
    }
  });
  if(id==='home')renderHome();
};

const openM=id=>$(id).classList.add('on'),closeM=id=>$(id).classList.remove('on');
const toast=t=>alert(t);

function renderHome(){
  const g=$('grid');g.innerHTML='';
  [...S.folders].sort((a,b)=>b.created-a.created).forEach(f=>{
    const d=document.createElement('div');d.className='folder';d.textContent=f.name;
    let t,long=false,sx,sy;
    d.onpointerdown=e=>{long=false;sx=e.clientX;sy=e.clientY;t=setTimeout(()=>{long=true;folderMenu(f)},500)};
    d.onpointermove=e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)clearTimeout(t)};
    d.onpointerup=d.onpointerleave=d.onpointercancel=()=>clearTimeout(t);
    d.oncontextmenu=e=>e.preventDefault();
    d.onclick=()=>{if(!long)openFolder(f)};
    g.appendChild(d);
  });
}
function askName(title,val,cb){
  $('mn-t').textContent=title;$('mn-i').value=val;openM('m-name');setTimeout(()=>$('mn-i').focus(),50);
  $('mn-ok').onclick=()=>{const v=$('mn-i').value.trim();if(!v)return;closeM('m-name');cb(v)};
}
function addFolder(n){S.folders.push({id:uid(),name:n,created:Date.now(),pages:[],vocab:[]});save();renderHome()}
function folderMenu(f){
  openM('m-menu');
  $('mm-r').onclick=()=>{closeM('m-menu');askName('이름 변경',f.name,v=>{f.name=v;save();renderHome()})};
  $('mm-d').onclick=()=>{closeM('m-menu');if(confirm(`"${f.name}" 폴더를 삭제할까요?`)){S.folders=S.folders.filter(x=>x!==f);save();renderHome()}};
}

const ABBR=new Set(['mr','mrs','ms','dr','prof','sr','jr','st','vs','etc','e.g','i.e','no','inc','ltd','co','mt','u.s','a.m','p.m']);
function splitParas(text){
  const words=text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean),out=[];let cur=[];
  words.forEach(w=>{
    cur.push(w);
    const m=w.match(/^(.*?)([.!?]+)(["'”’)\]]*)$/);
    if(m){
      const base=m[1].replace(/^["'“‘(\[]+/,'').toLowerCase();
      const abbr=m[2]==='.'&&(ABBR.has(base)||(/^[A-Z]$/.test(base.toUpperCase())&&base.length===1));
      if(!abbr){out.push(cur);cur=[]}
    }
  });
  if(cur.length)out.push(cur);
  return out;
}
const core=w=>{const m=w.match(/^([^A-Za-z0-9가-힣]*)(.*?)([^A-Za-z0-9가-힣]*)$/);return m||['', '', w, '']};
const flat=p=>splitParas(p.text).flat();

function ensurePageVocabs(){
  if(!F.pages.length)F.pages.push({id:uid(),text:'',vocab:[]});

  // 예전 버전의 폴더 전체 단어장을 페이지별 단어장으로 한 번만 자동 분배
  if(Array.isArray(F.vocab)){
    const old=F.vocab;
    F.pages.forEach(p=>{
      if(!Array.isArray(p.vocab))p.vocab=[];
    });

    old.forEach(v=>{
      const ranges=Array.isArray(v.ranges)?v.ranges:[];
      const targets=F.pages.filter(p=>ranges.some(r=>r.p===p.id));
      if(targets.length){
        targets.forEach(p=>{
          const copy={id:uid(),text:v.text,type:v.type||'word',meaning:v.meaning||'',ranges:ranges.filter(r=>r.p===p.id)};
          if(!p.vocab.some(x=>x.text.toLowerCase()===copy.text.toLowerCase() && x.type===copy.type)){
            p.vocab.push(copy);
          }
        });
      }
    });
    delete F.vocab;
    save();
  }else{
    F.pages.forEach(p=>{if(!Array.isArray(p.vocab))p.vocab=[]});
  }
}

function pageVocab(){
  const p=F.pages[idx];
  if(!p)return [];
  if(!Array.isArray(p.vocab))p.vocab=[];
  return p.vocab;
}

function inRange(pid,i){
  for(const v of pageVocab())for(const r of v.ranges)if(r.p===pid&&i>=r.s&&i<=r.e)return {v,r};
  return null;
}

function openFolder(f){
  F=f;idx=0;
  ensurePageVocabs();
  $('ftitle').textContent=f.name;
  if(!F.pages.length){F.pages.push({id:uid(),text:'',vocab:[]});save()}
  show('fold');
  renderStage(true);
}

function createPageEl(p, pIndex){
  const d=document.createElement('div');
  d.className='pg';
  d.dataset.pageIndex = pIndex;
  
  if(pIndex === F.pages.length){
    d.classList.add('add');
    d.textContent='+';
    d.onclick=e=>{
      e.stopPropagation();
      // 회색 + 페이지는 '이동' 버튼으로만 현재 페이지가 된다.
      // 회색 페이지 자체를 눌러도 회색 페이지로 이동하지 않고,
      // 그 자리에 새 본문 페이지를 추가한 뒤 기존 본문 페이지에 그대로 머문다.
      const oldPageCount = F.pages.length;
      const currentPage = Math.min(idx, Math.max(0, oldPageCount - 1));
      F.pages.push({id:uid(),text:'',vocab:[]});
      idx = currentPage;
      save();
      renderStage(true);
    };
    return d;
  }
  
  if(!p.text){
    d.classList.add('empty');
    d.innerHTML='<button class="btn" onclick="editPage()">+ 본문 추가</button>';
    return d;
  }
  let n=0;
  splitParas(p.text).forEach(par=>{
    const el=document.createElement('p');
    par.forEach(w=>{
      const i=n++,m=core(w);
      if(m[1])el.append(m[1]);
      const s=document.createElement('span');s.className='w'+(inRange(p.id,i)?' h':'');s.textContent=m[2];
      s.onclick=()=>toggleWord(p,i,m[2],s);
      el.append(s);
      if(m[3])el.append(m[3]);
      el.append(' ');
    });
    d.appendChild(el);
  });
  return d;
}

function renderStage(forceRebuild = false){
  const vp=$('viewport');
  
  if(forceRebuild) vp.innerHTML = '';
  
  const totalCount = F.pages.length + 1; // 본문 카드들 + 맨 끝 '+' 추가 카드
  
  // 필요한 카드들 DOM 생성 및 유지
  for(let i=0; i<totalCount; i++){
    let card = vp.querySelector(`[data-page-index="${i}"]`);
    if(!card){
      card = createPageEl(F.pages[i], i);
      vp.appendChild(card);
    }
    
    // 위치 클래스 업데이트
    card.className = 'pg';
    if(i === idx) card.classList.add('cur');
    else if(i === idx - 1) card.classList.add('prev');
    else if(i === idx + 1) card.classList.add('next');
    else if(i < idx) card.classList.add('far-left');
    else card.classList.add('far-right');
    
    if(i === F.pages.length) card.classList.add('add');
    else if(!F.pages[i].text) card.classList.add('empty');
  }
}

function prevPage(){
  if(idx > 0){
    idx--;
    renderStage();
  }
}

function nextPage(){
  // 본문 페이지뿐 아니라 맨 끝의 회색 + 페이지까지 이동할 수 있다.
  if(idx < F.pages.length){
    idx++;
    renderStage();
  }
}

function editPage(){
  const p=F.pages[idx];$('mb-t').textContent=p.text?'본문 수정':'본문 추가';$('mb-i').value=p.text;
  $('mb-del').style.display=F.pages.length>1||p.text?'':'none';openM('m-body');
  $('mb-ok').onclick=()=>{
    const v=$('mb-i').value.trim();if(!v)return;
    if(p.text&&v!==p.text){
      if(!confirm('본문을 수정해도 이 페이지의 단어와 형광펜을 유지할까요?'))return;

      // 수정 전 본문에서 형광펜이 칠해진 단어를 기억하고,
      // 수정 후 본문에서 같은 단어를 찾아 새 위치로 옮김.
      const oldWords=flat(p).map(w=>core(w)[2]);
      const highlighted=[];

      p.vocab.forEach(vocab=>{
        if(!Array.isArray(vocab.ranges))return;
        vocab.ranges.forEach(r=>{
          if(r.p!==p.id)return;
          const phrase=oldWords.slice(r.s,r.e+1).join(' ').trim();
          if(phrase) highlighted.push({vocab,phrase});
        });
      });

      const newWords=flat({text:v}).map(w=>core(w)[2]);
      p.vocab.forEach(vocab=>vocab.ranges=[]);

      highlighted.forEach(({vocab,phrase})=>{
        const target=phrase.toLowerCase().split(/\s+/);
        let found=-1;
        for(let i=0;i+target.length<=newWords.length;i++){
          const ok=target.every((word,k)=>
            newWords[i+k].toLowerCase()===word
          );
          if(ok){found=i;break;}
        }
        if(found>=0){
          vocab.ranges.push({p:p.id,s:found,e:found+target.length-1});
        }
      });

      // 새 본문에서 찾을 수 없어진 항목만 제거하고,
      // 찾은 단어/숙어는 그대로 유지.
      p.vocab=p.vocab.filter(vocab=>vocab.ranges.length);
    }

    p.text=v;
    save();
    closeM('m-body');
    renderStage(true);
  };
  $('mb-del').onclick=()=>{
    if(!confirm('이 페이지를 삭제할까요?'))return;
    p.vocab=[];
    F.pages.splice(idx,1);if(idx>=F.pages.length)idx=Math.max(0,F.pages.length-1);
    save();closeM('m-body');renderStage(true);
  };
}

function toggleWord(p,i,word,el){
  if(!word) return;
  const hit=inRange(p.id,i);
  const list=pageVocab();

  if(hit){
    hit.v.ranges=hit.v.ranges.filter(r=>r!==hit.r);
    if(!hit.v.ranges.length)p.vocab=p.vocab.filter(x=>x!==hit.v);
    el.classList.remove('h');
  }else{
    let v=list.find(x=>x.text.toLowerCase()===word.toLowerCase()&&x.type==='word');
    if(!v){v={id:uid(),text:word,type:'word',meaning:'',ranges:[]};p.vocab.push(v)}
    v.ranges.push({p:p.id,s:i,e:i});
    el.classList.add('h');
  }
  save();
}

function copyText(t,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}
}
const bodyText=()=>F.pages.filter(p=>p.text).map(p=>splitParas(p.text).map(x=>x.join(' ')).join('\n\n')).join('\n\n');
function copyBody(){copyText(bodyText(),'문단이 나뉜 본문을 복사했어요')}

function copyVocabList(){
  const list=pageVocab();
  const words = list.filter(v => v.type === 'word');
  const idioms = list.filter(v => v.type === 'idiom');
  
  let res = '[단어]\n';
  if(words.length){
    res += words.map(v => `${v.meaning || '(뜻 없음)'} ${v.text}`).join('\n');
  } else {
    res += '(단어 없음)';
  }

  res += '\n\n[숙어]\n';
  if(idioms.length){
    res += idioms.map(v => `${v.meaning || '(뜻 없음)'} ${v.text}`).join('\n');
  } else {
    res += '(숙어 없음)';
  }

  copyText(res, '단어장을 지정된 양식으로 복사했습니다!');
}

function openVocab(){ensurePageVocabs();vtab='word';renderVocab();openM('m-vocab')}
function renderVocab(){
  $('t-word').className=vtab==='word'?'on':'';$('t-idiom').className=vtab==='idiom'?'on':'';
  const L=$('vlist');L.innerHTML='';
  pageVocab().filter(v=>v.type===vtab).forEach(v=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<div></div><input placeholder="뜻 입력">';
    r.firstChild.textContent=v.text;
    const inp=r.lastChild;inp.value=v.meaning;
    inp.oninput=()=>{v.meaning=inp.value;save();updQ()};
    L.appendChild(r);
  });
  if(!L.children.length)L.innerHTML='<div style="color:var(--sub);padding:20px 0;text-align:center">본문에서 모르는 단어를 눌러 추가하세요.</div>';
  updQ();
}
function updQ(){const list=pageVocab();const ok=list.length&&list.every(v=>v.meaning.trim());$('qstart').disabled=!ok;$('qstart').style.display='inline-block'}
function copyPrompt(){
  const words=pageVocab().map(v=>v.text).join('\n');
  const p=F.pages[idx];
  const text=p&&p.text?p.text:'';
  copyText(`[본문]\n${text}\n\n[단어]\n${words}\n\n위 본문 맥락에 맞는 정확한 뜻을 아래 양식으로 정리해줘.\n단어: 뜻\n[숙어]\n숙어: 뜻`,'AI 프롬프트를 복사했어요');
}
function bulkAsk(){$('bk-i').value='';openM('m-bulk')}
function matchSeq(words){
  const ok=(a,b)=>a===b||(a.length>=4&&b.length>=4&&a.slice(0,4)===b.slice(0,4));
  for(const p of [F.pages[idx]]){
    const t=flat(p).map(w=>core(w)[2].toLowerCase());
    for(let i=0;i+words.length<=t.length;i++)
      if(words.every((w,k)=>ok(t[i+k],words[k])))return {p:p.id,s:i,e:i+words.length-1};
  }
  return null;
}
function bulkApply(){
  let mode='word',nW=0,nI=0;
  const p=F.pages[idx], list=pageVocab();
  $('bk-i').value.split('\n').forEach(raw=>{
    let line=raw.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').replace(/\*\*/g,'').trim();
    if(!line)return;
    if(!/[:：]\s*\S/.test(line)||/^\W*\[?\s*(숙어\vert{}단어)\s*\]?\W*[:：]?\s*$/.test(line)){
      if(line.includes('숙어')){mode='idiom';return}
      if(/단어/.test(line)){mode='word';return}
    }
    const k=line.search(/[:：]/);if(k<1)return;
    const text=line.slice(0,k).replace(/[\[\]]/g,'').trim(),mean=line.slice(k+1).trim();
    if(!text||!mean)return;
    const low=text.toLowerCase();let v=list.find(x=>x.text.toLowerCase()===low);
    if(mode==='idiom'){
      if(v&&v.type==='idiom'){v.meaning=mean;nI++;return}
      const words=low.split(/\s+/),seq=matchSeq(words);
      if(seq){
        const keep=[];
        list.forEach(x=>{
          x.ranges=x.ranges.filter(r=>!(r.p===seq.p&&r.s<=seq.e&&r.e>=seq.s));
          if(x.ranges.length||x.id===(v&&v.id))keep.push(x);
        });
        p.vocab=keep;
      }
      if(!v){v={id:uid(),text,type:'idiom',meaning:'',ranges:[]};p.vocab.push(v)}
      v.type='idiom';v.text=text;v.meaning=mean;if(seq)v.ranges=[seq];nI++;
    }else{
      if(!v){v={id:uid(),text,type:'word',meaning:'',ranges:[]};p.vocab.push(v)}
      v.meaning=mean;nW++;
    }
  });
  save();closeM('m-bulk');renderVocab();renderStage(true);
  toast(`등록 완료: 단어 ${nW}개, 숙어 ${nI}개`);
}

/* 퀴즈 로직 */
const norm=s=>s.toLowerCase().replace(/[\s~.]/g,'');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function startQuiz(list){
  const items=Array.isArray(list)?list:pageVocab().slice();
  Q={queue:shuffle(items.slice()),wrong:[],right:0,cur:null,total:items.length,autoTimer:null};
  closeM('m-vocab');show('quiz');nextQ();
}
function qStat(){$('qstat').textContent=`남은 단어: ${Q.queue.length+(Q.cur&&!Q.done?1:0)} | 오답: ${Q.wrong.length}`}

function nextQ(){
  if(Q&&Q.autoTimer){clearTimeout(Q.autoTimer);Q.autoTimer=null;}
  if(!Q.queue.length)return finishQuiz();
  Q.cur=Q.queue.shift();Q.done=false;qStat();
  const b=$('qbody');
  b.innerHTML=`
    <div class="word">${esc(Q.cur.text)}</div>
    <input id="qi" placeholder="뜻을 입력하세요 (엔터)" autocomplete="off" autocapitalize="off">
    <button class="skip" id="qs">모르겠어요 (스킵하기)</button>
  `;
  const inp=$('qi');inp.focus();
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())grade(inp.value)};
  $('qs').onclick=()=>result(false);
}

function grade(v){
  const parts=Q.cur.meaning.split(/[,;，/]/).map(norm).filter(Boolean),a=norm(v);
  result(parts.includes(a)||norm(Q.cur.meaning)===a);
}

function result(ok){
  Q.done=true;const c=Q.cur,b=$('qbody');
  b.innerHTML=`
    <div class="quiz-result">
      <div class="quiz-answer">[뜻] ${esc(c.meaning)}</div>
      <div class="res" style="color:var(${ok?'--green':'--red'})">${ok?'정답':'오답'}</div>
      ${ok?'':`<div class="quiz-wrong-msg" id="fix">채점이 잘못되었어요</div>`}
      <div class="quiz-next"><button class="btn" id="nx">다음</button></div>
    </div>
  `;
  if(ok){
    markRight(c);qStat();
  }else{
    Q.wrong.push(c);qStat();
    $('fix').onclick=e=>{e.stopPropagation();Q.wrong=Q.wrong.filter(x=>x!==c);markRight(c);qStat();nextQ();};
  }
  $('nx').onclick=e=>{e.stopPropagation();nextQ()};
  // 정답/오답 결과는 잠시 보여준 뒤 자동으로 다음 문제로 넘어갑니다.
  Q.autoTimer=setTimeout(()=>{if(Q&&Q.done&&Q.cur===c)nextQ()},2500);
}

document.addEventListener('click',e=>{
  const quiz=$('quiz');
  if(!quiz || !quiz.classList.contains('on') || !Q || !Q.done)return;
  // 결과 화면의 빈 바깥 여백을 누르면 다음 문제로 이동
  if(e.target===quiz || e.target===$('qbody')) nextQ();
});

const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function markRight(c){Q.right++;const p=F.pages[idx];if(p)p.vocab=p.vocab.filter(x=>x!==c);save()}

function finishQuiz(){
  Q.cur=null;
  $('qstat').textContent='';$('qbody').innerHTML=`
    <div class="res" style="font-size:32px;color:var(--fg)">퀴즈 완료!</div>
    <div class="mean" style="margin-top:12px">맞힌 단어: ${Q.right}개 (단어장에서 삭제됨)</div>
    <div class="mean">틀린 단어: ${Q.wrong.length}개 (단어장에 유지됨)</div>
    <div class="acts" style="margin-top:24px;justify-content:center;gap:12px">
      ${Q.wrong.length?'<button class="btn o" id="re">틀린 단어로 다시 퀴즈</button>':''}
      <button class="btn" id="bk">단어장으로 돌아가기</button>
    </div>
  `;
  if(Q.wrong.length)$('re').onclick=()=>startQuiz(Q.wrong.slice());$('bk').onclick=()=>endQuiz(false);
}

function endQuiz(ask){
  if(ask&&!confirm('퀴즈를 그만할까요? 지금까지 맞힌 단어는 이미 삭제됐어요.'))return;
  show('fold');renderStage(true);openVocab();
}

renderHome();
</script>
